<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 - 컴퓨터 시스템 통합 마스터 관리 시스템</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>비밀번호 재설정</h1>
    <p class="subtitle" id="subtitle">링크 확인 중...</p>

    <div id="message" class="message"></div>

    <form id="reset-form" style="display:none;">
      <div class="field">
        <label for="password">새 비밀번호</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="password-confirm">새 비밀번호 확인</label>
        <input type="password" id="password-confirm" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn" id="submit-btn">비밀번호 변경</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">로그인으로 돌아가기</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const subtitle = document.getElementById("subtitle");
  const messageBox = document.getElementById("message");
  const form = document.getElementById("reset-form");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message show " + type;
  }

  // 링크가 만료/무효인 경우 URL 해시에 error 파라미터가 붙어서 옵니다
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (hashParams.get("error")) {
    subtitle.textContent = "링크가 만료되었거나 유효하지 않습니다";
    showMessage("비밀번호 찾기를 다시 요청해주세요.", "error");
  } else {
    // Supabase 클라이언트가 URL의 복구 토큰을 처리하면 PASSWORD_RECOVERY 이벤트가 발생합니다
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        subtitle.textContent = "새 비밀번호를 입력해주세요";
        form.style.display = "block";
      }
    });

    // 이미 세션이 잡혀있는 경우(뒤늦게 페이지 로드 등) 대비
    setTimeout(async () => {
      if (form.style.display === "none") {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          subtitle.textContent = "새 비밀번호를 입력해주세요";
          form.style.display = "block";
        } else {
          subtitle.textContent = "링크가 만료되었거나 유효하지 않습니다";
          showMessage("비밀번호 찾기를 다시 요청해주세요.", "error");
        }
      }
    }, 2000);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("password-confirm").value;

    if (password !== passwordConfirm) {
      showMessage("비밀번호가 일치하지 않습니다.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "변경 중...";

    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      showMessage("비밀번호 변경 중 오류가 발생했습니다: " + error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "비밀번호 변경";
      return;
    }

    showMessage("비밀번호가 변경되었습니다. 잠시 후 로그인 화면으로 이동합니다.", "success");
    form.style.display = "none";
    setTimeout(() => { location.href = "login.html"; }, 1800);
  });
</script>
</body>
</html>
