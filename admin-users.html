<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사용자 관리 - 컴퓨터 시스템 통합 마스터 관리 시스템</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="topbar">
  <div class="brand">컴퓨터 시스템 통합 마스터 관리 시스템</div>
  <nav>
    <a href="dashboard.html">대시보드</a>
    <a href="master-list.html">설비 마스터</a>
    <a href="admin-users.html" class="active">사용자 관리</a>
  </nav>
  <div class="user-box">
    <span id="user-info">불러오는 중...</span>
    <button class="btn btn-secondary btn-sm" onclick="logout()">로그아웃</button>
  </div>
</div>

<div class="container">
  <div class="page-header">
    <h2>사용자 관리</h2>
    <p>가입 신청을 승인하거나 계정 권한을 관리합니다.</p>
  </div>

  <div class="stat-grid" id="stat-grid"></div>

  <div class="card">
    <div class="tabs" id="tabs">
      <button data-tab="pending" class="active">승인 대기</button>
      <button data-tab="approved">승인됨</button>
      <button data-tab="disabled">비활성화/거절</button>
      <button data-tab="all">전체</button>
    </div>
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>이메일</th>
            <th>부서</th>
            <th>권한</th>
            <th>상태</th>
            <th>가입일</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="user-table-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none;">해당하는 사용자가 없습니다.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  let allProfiles = [];
  let currentTab = "pending";
  let myId = null;

  async function loadUsers() {
    const { data, error } = await supabaseClient
      .from("profiles")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      alert("사용자 목록을 불러오지 못했습니다.");
      return;
    }
    allProfiles = data;
    renderStats();
    renderTable();
  }

  function renderStats() {
    const grid = document.getElementById("stat-grid");
    const total = allProfiles.length;
    const pending = allProfiles.filter((p) => p.status === "pending").length;
    const approved = allProfiles.filter((p) => p.status === "approved").length;
    const admins = allProfiles.filter((p) => p.role === "admin").length;

    grid.innerHTML = `
      <div class="stat-card"><div class="num">${total}</div><div class="label">전체 사용자</div></div>
      <div class="stat-card"><div class="num">${pending}</div><div class="label">승인 대기</div></div>
      <div class="stat-card"><div class="num">${approved}</div><div class="label">승인됨</div></div>
      <div class="stat-card"><div class="num">${admins}</div><div class="label">관리자</div></div>
    `;
  }

  function filteredProfiles() {
    if (currentTab === "all") return allProfiles;
    if (currentTab === "disabled") return allProfiles.filter((p) => p.status === "disabled" || p.status === "rejected");
    return allProfiles.filter((p) => p.status === currentTab);
  }

  function renderTable() {
    const tbody = document.getElementById("user-table-body");
    const emptyState = document.getElementById("empty-state");
    const rows = filteredProfiles();

    if (rows.length === 0) {
      tbody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    tbody.innerHTML = rows.map((p) => `
      <tr>
        <td>${escapeHtml(p.name || "-")}</td>
        <td>${escapeHtml(p.email)}</td>
        <td>${escapeHtml(p.department || "-")}</td>
        <td><span class="badge badge-${p.role}">${ROLE_LABEL[p.role]}</span></td>
        <td><span class="badge badge-${p.status}">${STATUS_LABEL[p.status]}</span></td>
        <td>${new Date(p.created_at).toLocaleDateString("ko-KR")}</td>
        <td class="actions-cell">${renderActions(p)}</td>
      </tr>
    `).join("");
  }

  function renderActions(p) {
    const isSelf = p.id === myId;
    const btns = [];

    if (p.status === "pending") {
      btns.push(`<button class="btn btn-success btn-sm" onclick="updateUser('${p.id}', {status:'approved'})">승인</button>`);
      btns.push(`<button class="btn btn-danger btn-sm" onclick="updateUser('${p.id}', {status:'rejected'})">거절</button>`);
    } else if (p.status === "approved") {
      btns.push(`<button class="btn btn-danger btn-sm" onclick="updateUser('${p.id}', {status:'disabled'})" ${isSelf ? "disabled title='본인 계정은 비활성화할 수 없습니다'" : ""}>비활성화</button>`);
      if (p.role === "user") {
        btns.push(`<button class="btn btn-secondary btn-sm" onclick="updateUser('${p.id}', {role:'admin'})">관리자 지정</button>`);
      } else if (!isSelf) {
        btns.push(`<button class="btn btn-secondary btn-sm" onclick="updateUser('${p.id}', {role:'user'})">관리자 해제</button>`);
      }
    } else {
      btns.push(`<button class="btn btn-success btn-sm" onclick="updateUser('${p.id}', {status:'approved'})">재승인</button>`);
    }
    return btns.join("");
  }

  async function updateUser(id, patch) {
    const { error } = await supabaseClient.from("profiles").update(patch).eq("id", id);
    if (error) {
      alert("처리 중 오류가 발생했습니다: " + error.message);
      return;
    }
    await loadUsers();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    renderTable();
  });

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;
    myId = profile.id;
    document.getElementById("user-info").textContent =
      `${profile.name || profile.email} · ${profile.department || "-"} · ${ROLE_LABEL[profile.role]}`;
    await loadUsers();
  })();
</script>
</body>
</html>
