<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원가입 - 컴퓨터 시스템 통합 마스터 관리 시스템</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>회원가입</h1>
    <p class="subtitle">가입 후 관리자 승인이 필요합니다</p>

    <div id="message" class="message"></div>

    <form id="signup-form">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="department">부서</label>
        <input type="text" id="department" placeholder="예: 품질경영팀" required />
      </div>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="password-confirm">비밀번호 확인</label>
        <input type="password" id="password-confirm" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn" id="submit-btn">가입 신청</button>
    </form>

    <div class="auth-footer">
      이미 계정이 있으신가요? <a href="login.html">로그인</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("signup-form");
  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message show " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const department = document.getElementById("department").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("password-confirm").value;

    if (password !== passwordConfirm) {
      showMessage("비밀번호가 일치하지 않습니다.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "처리 중...";

    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { name, department },
      },
    });

    if (error) {
      showMessage(error.message.includes("already") ? "이미 가입된 이메일입니다." : "가입 중 오류가 발생했습니다: " + error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "가입 신청";
      return;
    }

    showMessage("가입 신청이 완료되었습니다. 관리자 승인 후 로그인할 수 있습니다.", "success");
    form.reset();
    submitBtn.textContent = "가입 신청 완료";
  });
</script>
</body>
</html>
