<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대시보드 - 컴퓨터 시스템 통합 마스터 관리 시스템</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="topbar">
  <div class="brand">컴퓨터 시스템 통합 마스터 관리 시스템</div>
  <nav>
    <a href="dashboard.html" class="active">대시보드</a>
    <a href="master-list.html">설비 마스터</a>
    <a href="admin-users.html" id="admin-link" style="display:none;">사용자 관리</a>
  </nav>
  <div class="user-box">
    <span id="user-info">불러오는 중...</span>
    <button class="btn btn-secondary btn-sm" onclick="logout()">로그아웃</button>
  </div>
</div>

<div class="container">
  <div class="page-header">
    <h2 id="greeting">안녕하세요</h2>
    <p>마스터 파일 등록 및 조회 시스템입니다.</p>
  </div>

  <div class="stat-grid">
    <div class="card" style="padding:20px;">
      <h3 style="margin:0 0 6px; font-size:15px;">설비 마스터 조회</h3>
      <p style="margin:0 0 14px; font-size:13px; color:var(--color-text-muted);">등록된 설비 마스터 정보를 검색하고 확인합니다.</p>
      <a href="master-list.html" class="btn" style="width:auto; display:inline-flex;">바로가기</a>
    </div>
    <div class="card" style="padding:20px;" id="upload-card">
      <h3 style="margin:0 0 6px; font-size:15px;">설비 마스터 업로드</h3>
      <p style="margin:0 0 14px; font-size:13px; color:var(--color-text-muted);">시스템에서 추출한 데이터를 붙여넣어 일괄 등록/갱신합니다. (관리자 전용)</p>
      <a href="master-upload.html" class="btn btn-secondary" style="width:auto; display:inline-flex;">바로가기</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  (async () => {
    const profile = await requireApprovedUser();
    if (!profile) return;

    document.getElementById("greeting").textContent = `안녕하세요, ${profile.name || profile.email}님`;
    document.getElementById("user-info").textContent =
      `${profile.name || profile.email} · ${profile.department || "-"} · ${ROLE_LABEL[profile.role]}`;

    if (profile.role === "admin") {
      document.getElementById("admin-link").style.display = "inline";
    } else {
      document.getElementById("upload-card").style.display = "none";
    }
  })();
</script>
</body>
</html>
