<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 찾기 - 컴퓨터 시스템 통합 마스터 관리 시스템</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>비밀번호 찾기</h1>
    <p class="subtitle">가입한 이메일로 재설정 링크를 보내드려요</p>

    <div id="message" class="message"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <button type="submit" class="btn" id="submit-btn">재설정 링크 받기</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">로그인으로 돌아가기</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("forgot-form");
  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message show " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "처리 중...";

    const email = document.getElementById("email").value.trim();
    const redirectTo = `${location.origin}${location.pathname.replace("forgot-password.html", "reset-password.html")}`;

    await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

    // 이메일 존재 여부와 무관하게 동일한 안내 문구를 보여줍니다 (계정 노출 방지)
    showMessage("입력하신 이메일로 비밀번호 재설정 링크를 보냈습니다. 메일함(스팸함 포함)을 확인해주세요.", "success");
    submitBtn.textContent = "재설정 링크 받기";
    submitBtn.disabled = false;
  });
</script>
</body>
</html>
