<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 - 컴퓨터 시스템 통합 마스터 관리 시스템</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>컴퓨터 시스템 통합<br />마스터 관리 시스템</h1>
    <p class="subtitle">로그인</p>

    <div id="message" class="message"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn" id="submit-btn">로그인</button>
    </form>

    <div class="auth-footer">
      계정이 없으신가요? <a href="signup.html">회원가입</a><br />
      <a href="forgot-password.html">비밀번호를 잊으셨나요?</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  const form = document.getElementById("login-form");
  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message show " + type;
  }

  // 이미 로그인 + 승인된 사용자는 바로 대시보드로
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const profile = await getCurrentProfile();
    if (profile && profile.status === "approved") {
      location.href = "dashboard.html";
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "로그인 중...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage("이메일 또는 비밀번호가 올바르지 않습니다.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";
      return;
    }

    const profile = await getCurrentProfile();

    if (!profile) {
      showMessage("계정 정보를 불러올 수 없습니다. 관리자에게 문의해주세요.", "error");
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";
      return;
    }

    if (profile.status === "pending") {
      showMessage("관리자 승인 대기 중인 계정입니다. 승인 후 다시 로그인해주세요.", "info");
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";
      return;
    }

    if (profile.status !== "approved") {
      showMessage("비활성화된 계정입니다. 관리자에게 문의해주세요.", "error");
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";
      return;
    }

    location.href = "dashboard.html";
  });
</script>
</body>
</html>
